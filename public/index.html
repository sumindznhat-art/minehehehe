<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>MINH SESSION API</title> <style> * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at top, #243b68, #07101f 60%); color: white; } .container { width: min(520px, 94%); margin: auto; padding: 22px 0 40px; } .logo { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-top: 15px; } .sub { text-align: center; opacity: .65; font-size: 12px; margin-top: 5px; } .card { margin-top: 18px; padding: 18px; border-radius: 24px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(18px); box-shadow: 0 20px 60px rgba(0,0,0,.35); } label { display: block; font-size: 12px; opacity: .7; margin-bottom: 7px; } input { width: 100%; height: 48px; border: 0; outline: none; border-radius: 14px; padding: 0 15px; background: rgba(0,0,0,.35); color: white; font-size: 17px; font-weight: 700; } .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; } button { height: 46px; border: 0; border-radius: 14px; color: white; font-size: 14px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #2563eb, #7c3aed); } button:active { transform: scale(.97); } .next { grid-column: span 2; background: linear-gradient(135deg, #06b6d4, #2563eb); } .result { margin-top: 18px; padding: 18px; border-radius: 20px; background: rgba(0,0,0,.28); } .session { text-align: center; font-size: 32px; font-weight: 900; } .dice { display: flex; justify-content: center; gap: 10px; margin: 16px 0; } .die { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 16px; background: rgba(255,255,255,.1); font-size: 24px; font-weight: 900; } .total { text-align: center; font-size: 18px; opacity: .9; } .status { margin-top: 12px; text-align: center; font-size: 12px; opacity: .65; } pre { margin-top: 16px; max-height: 280px; overflow: auto; padding: 14px; border-radius: 16px; background: #050b14; color: #b9d8ff; font-size: 11px; white-space: pre-wrap; word-break: break-word; } </style> </head> <body> <div class="container"> <div class="logo">MINH SESSION API</div> <div class="sub">INFINITE SESSION • JSON API</div> <div class="card"> <label>NHẬP PHIÊN</label> <input id="sessionInput" inputmode="numeric" value="18337558" placeholder="Nhập mã phiên..." > <div class="buttons"> <button onclick="loadSession()"> TẢI PHIÊN </button> <button onclick="previousSession()"> PHIÊN TRƯỚC </button> <button class="next" onclick="nextSession()"> TIẾP PHIÊN ∞ </button> </div> <div class="result"> <div class="session" id="session"> — </div> <div class="dice"> <div class="die" id="d1">—</div> <div class="die" id="d2">—</div> <div class="die" id="d3">—</div> </div> <div class="total"> Tổng: <b id="total">—</b> </div> <div class="status" id="status"> Sẵn sàng </div> </div> <pre id="json">JSON sẽ hiển thị tại đây...</pre> </div> </div> <script> const $ = id => document.getElementById(id); function showJSON(data) { $("json").textContent = JSON.stringify(data, null, 2); } function showSession(data) { const s = data.session || data.next || data.previous; if (!s) return; $("session").textContent = "#" + s.phien; $("d1").textContent = s.xuc_xac?.[0] ?? "—"; $("d2").textContent = s.xuc_xac?.[1] ?? "—"; $("d3").textContent = s.xuc_xac?.[2] ?? "—"; $("total").textContent = s.tong ?? "—"; $("sessionInput").value = s.phien; $("status").textContent = "Đã tải phiên #" + s.phien; } async function api(url, options = {}) { $("status").textContent = "Đang tải..."; try { const response = await fetch(url, options); const data = await response.json(); showJSON(data); if (!response.ok) { throw new Error( data.error || "API error" ); } showSession(data); return data; } catch (error) { $("status").textContent = error.message; showJSON({ ok: false, error: error.message }); } } function getId() { const value = Number($("sessionInput").value); if (!Number.isSafeInteger(value)) { $("status").textContent = "Phiên không hợp lệ"; return null; } return value; } function loadSession() { const id = getId(); if (id === null) return; api("/api/session/" + id); } function nextSession() { const id = getId(); if (id === null) return; api("/api/next/" + id); } function previousSession() { const id = getId(); if (id === null) return; api("/api/previous/" + id); } /* Cho phép Enter để tải phiên */ $("sessionInput") .addEventListener("keydown", e => { if (e.key === "Enter") { loadSession(); } }); /* Tải phiên đầu tiên */ loadSession(); </script> </body> </html>
