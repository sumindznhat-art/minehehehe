<!DOCTYPE html> <html lang="vi"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1" > <title>Session API Demo</title> <style> *{ box-sizing:border-box; } body{ margin:0; min-height:100vh; padding:20px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif; background: radial-gradient( circle at top left, #dbeafe, transparent 35% ), #f8fafc; color:#172033; } .app{ width:min(680px,100%); margin:auto; } .card{ background:rgba(255,255,255,.92); border-radius:26px; padding:22px; box-shadow: 0 20px 60px rgba(15,23,42,.12); } .logo{ width:70px; height:70px; margin:auto; display:grid; place-items:center; border-radius:22px; background: linear-gradient( 135deg, #2563eb, #6366f1 ); color:white; font-size:32px; } h1{ text-align:center; margin:14px 0 5px; } .sub{ text-align:center; color:#64748b; margin-bottom:22px; } button{ width:100%; border:0; border-radius:15px; padding:15px; margin-top:12px; color:white; background: linear-gradient( 135deg, #2563eb, #4f46e5 ); font-size:16px; font-weight:800; } button:active{ transform:scale(.98); } .status{ margin-top:15px; padding:12px; border-radius:13px; background:#f1f5f9; color:#475569; text-align:center; } .session{ margin-top:15px; padding:16px; border-radius:18px; background:#f8fafc; border:1px solid #e2e8f0; } .session strong{ font-size:19px; } .dice{ display:flex; gap:8px; margin-top:12px; } .die{ flex:1; padding:13px 5px; text-align:center; border-radius:12px; background:white; border:1px solid #e2e8f0; font-size:20px; font-weight:800; } .total{ margin-top:12px; padding:10px; text-align:center; border-radius:12px; background:#dbeafe; font-weight:800; } </style> </head> <body> <div class="app"> <div class="card"> <div class="logo"> 📡 </div> <h1>SESSION API</h1> <div class="sub"> Dashboard dữ liệu mẫu </div> <button onclick="loadSessions()"> 🔄 TẢI DỮ LIỆU API </button> <div id="status" class="status"> Chưa tải dữ liệu </div> <div id="list"></div> </div> </div> <script> async function loadSessions(){ const status = document.getElementById("status"); const list = document.getElementById("list"); status.textContent = "Đang tải..."; list.innerHTML = ""; try{ const response = await fetch("/api/sessions", { cache:"no-store" }); if(!response.ok){ throw new Error( "HTTP " + response.status ); } const data = await response.json(); if( !data.success || !Array.isArray(data.sessions) ){ throw new Error( "JSON không hợp lệ" ); } for(const item of data.sessions){ const box = document.createElement("div"); box.className = "session"; const title = document.createElement("strong"); title.textContent = "Phiên " + item.phien; const dice = document.createElement("div"); dice.className = "dice"; for(const value of item.xuc_xac){ const die = document.createElement("div"); die.className = "die"; die.textContent = value; dice.appendChild(die); } const total = document.createElement("div"); total.className = "total"; total.textContent = "Tổng: " + item.tong; box.appendChild(title); box.appendChild(dice); box.appendChild(total); list.appendChild(box); } status.textContent = "Đã tải " + data.count + " phiên."; }catch(error){ status.textContent = "Lỗi API: " + error.message; } } loadSessions(); </script> </body> </html>
